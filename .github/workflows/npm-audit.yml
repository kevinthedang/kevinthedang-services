name: Validation

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        validate: [audit, build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.validate }} validation
        run: npm run ${{ matrix.validate }}
