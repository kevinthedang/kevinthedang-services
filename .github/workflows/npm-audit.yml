name: Security & Build Checks

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [audit, build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }} check
        run: npm run ${{ matrix.check }}
